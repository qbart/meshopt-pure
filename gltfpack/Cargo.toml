[package]
name = "gltfpack"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure Rust port of gltfpack (https://github.com/zeux/meshoptimizer/tree/master/gltf)"

[lib]
name = "gltfpack"
path = "src/lib.rs"

[[bin]]
name = "gltfpack"
path = "src/main.rs"

[dependencies]
meshoptimizer = { path = ".." }
ktx = { package = "ktx-rs", git = "https://github.com/qbart/ktx-rs", default-features = false }
zstd-pure-rs = "0.2.0"

[lints]
workspace = true
