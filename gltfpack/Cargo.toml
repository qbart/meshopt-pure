[package]
name = "gltfpack"
description = "Pure Rust port of gltfpack (meshoptimizer's glTF optimizer): library and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# internal: not published to crates.io
publish = false

[lib]
name = "gltfpack"
path = "src/lib.rs"

[[bin]]
name = "gltfpack"
path = "src/main.rs"

[dependencies]
meshoptimizer = { workspace = true, features = ["simd"] }
ktx = { package = "ktx-rs", version = "4.4.3", default-features = false }
zstd-pure-rs = "0.2.0"

[lints]
workspace = true
