[package]
name = "meshoptimizer-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Ports of meshoptimizer tools/ (codecbench)"

[features]
default = ["simd"]
# `--no-default-features` benchmarks the scalar decoders (C++: MESHOPTIMIZER_NO_SIMD)
simd = ["meshoptimizer/simd"]

[dependencies]
meshoptimizer = { path = "..", default-features = false }

[lints]
workspace = true
