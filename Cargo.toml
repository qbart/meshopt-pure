[package]
name = "meshoptimizer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure Rust port of meshoptimizer (https://github.com/zeux/meshoptimizer)"

[features]
default = ["simd"]
# SIMD decoders with runtime CPU detection (the only `unsafe` in the crate, see docs/spec/38-simd.md)
simd = []

[dependencies]

[dev-dependencies]

[lints]
workspace = true

[workspace]
members = ["gltfpack", "clusterlod", "fuzz", "tools", "demo"]
exclude = ["fuzz/libfuzzer"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_arguments = "allow" # API mirrors the C signatures
