[package]
name = "meshoptimizer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pure Rust port of meshoptimizer (https://github.com/zeux/meshoptimizer)"

[dependencies]

[dev-dependencies]

[lints]
workspace = true

[workspace]
members = ["gltfpack", "clusterlod", "fuzz"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_arguments = "allow" # API mirrors the C signatures
