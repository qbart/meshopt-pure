[package]
name = "meshopt-pure"
description = "Pure Rust port of meshoptimizer: mesh optimization, simplification, clustering and compression"
keywords = ["mesh", "meshlet", "simplification", "compression", "gpu"]
categories = ["graphics", "game-development", "rendering", "compression"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The published crate leaves out tests and test data (see NOTICE.md).
include = ["/src/**", "/Cargo.toml", "/LICENSE.md", "/NOTICE.md", "/README.md"]

[lib]
# imported as `meshoptimizer`, like the C++ library
name = "meshoptimizer"

[features]
default = ["simd"]
# SIMD decoders with runtime CPU detection (the only `unsafe` in the crate, see docs/spec/38-simd.md)
simd = []

[dependencies]

[dev-dependencies]

[lints]
workspace = true

[workspace]
members = ["gltfpack", "clusterlod", "fuzz", "tools", "demo"]
exclude = ["fuzz/libfuzzer"]

# versions follow upstream meshoptimizer
[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/qbart/meshopt-pure"

[workspace.dependencies]
meshoptimizer = { package = "meshopt-pure", path = ".", version = "1.3.0", default-features = false }
clusterlod = { path = "clusterlod" }
gltfpack = { path = "gltfpack" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_arguments = "allow" # API mirrors the C signatures
